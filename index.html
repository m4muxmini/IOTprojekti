<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ulkovaloisuus</title>
  <!-- Chart.js -kirjasto kuvaajaa varten -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #eceff1; padding: 20px; }
    .card { background: white; padding: 20px; border-radius: 12px; max-width: 600px; margin: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .current-val { font-size: 3rem; color: #f57c00; margin: 10px 0; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Ulkona mitattu valoisuus</h2>
    <div>Viimeisin lukema:</div>
    <div id="currentLux" class="current-val">-- lux</div>
    
    <canvas id="luxChart"></canvas>
  </div>

  <script>
    // Aseta tähän oma ThingSpeak Channel ID:si!
    const CHANNEL_ID = '3498847';

    let chart;

    async function loadData() {
      try {
        // Haetaan viimeisimmät 30 mittausta
        const res = await fetch(`https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?results=30`);
        const data = await res.json();

        const feeds = data.feeds;
        if (!feeds || feeds.length === 0) return;

        // Uusin valoisuusarvo
        const latestLux = Math.round(feeds[feeds.length - 1].field1);
        document.getElementById('currentLux').innerText = `${latestLux} lux`;

        // Aikaleimat ja lux-arvot kuvaajaan
        const labels = feeds.map(f => new Date(f.created_at).toLocaleTimeString('fi-FI', { hour: '2-digit', minute: '2-digit' }));
        const values = feeds.map(f => parseFloat(f.field1));

        updateChart(labels, values);
      } catch (err) {
        console.error("Virhe ladattaessa dataa:", err);
      }
    }

    function updateChart(labels, values) {
      const ctx = document.getElementById('luxChart').getContext('2d');

      if (chart) {
        chart.data.labels = labels;
        chart.data.datasets[0].data = values;
        chart.update();
      } else {
        chart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: 'Valoisuus (Lux)',
              data: values,
              borderColor: '#f57c00',
              backgroundColor: 'rgba(245, 124, 0, 0.1)',
              fill: true,
              tension: 0.3
            }]
          },
          options: {
            responsive: true,
            scales: { y: { beginAtZero: true } }
          }
        });
      }
    }

    // Ladataan data heti ja päivitetään automaattisesti 15s välein
    loadData();
    setInterval(loadData, 15000);
  </script>
</body>
</html>
